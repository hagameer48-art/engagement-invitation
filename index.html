<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة خطوبة - أمير & فاطمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #e6dfd5;
            --card-cream: #efe9df;
            --text-dark: #4a4238;
            --text-muted: #7c7265;
            --accent-gold: #9c8464;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle, #f4efe6 0%, #ded6cb 100%);
        }
        .invitation-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-cream);
            border: 1px solid rgba(156, 132, 100, 0.25);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(74, 66, 56, 0.12);
            padding: 40px 25px;
            text-align: center;
            position: relative;
        }
        /* تصميم الحروف المتداخلة A & F بطريقة كلاسيكية بارزة */
        .monogram-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(156, 132, 100, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 2px 5px rgba(156, 132, 100, 0.15);
        }
        .monogram-letters {
            font-family: 'Amiri', serif;
            font-size: 2.8rem;
            font-style: italic;
            color: var(--text-dark);
            letter-spacing: -6px;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.9), 0 -1px 1px rgba(0, 0, 0, 0.1);
        }
        .header-title {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .names {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: var(--text-dark);
            margin: 15px 0;
            font-weight: 700;
        }
        .names span {
            display: block;
            font-size: 1.2rem;
            color: var(--text-muted);
            margin: 5px 0;
            font-family: 'Tajawal', sans-serif;
            font-weight: 300;
        }
        .date-badge {
            background: rgba(156, 132, 100, 0.1);
            border: 1px solid rgba(156, 132, 100, 0.3);
            color: var(--text-dark);
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            font-size: 1.05rem;
            margin: 15px 0 25px 0;
            font-weight: 500;
        }
        .countdown-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        .countdown-box {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(156, 132, 100, 0.2);
            border-radius: 10px;
            padding: 10px 5px;
        }
        .countdown-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            font-family: 'Amiri', serif;
        }
        .countdown-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .btn-action {
            display: block;
            width: 100%;
            background: var(--text-dark);
            color: #f4efe6;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(74, 66, 56, 0.2);
            transition: 0.2s;
        }
        .btn-action:hover {
            background: #352f27;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="invitation-container">
        <div class="header-title">Once in a Lifetime</div>
        
        <!-- إطار الحروف المتداخلة A & F -->
        <div class="monogram-box">
            <div class="monogram-letters">A&F</div>
        </div>

        <p style="font-size: 1rem; color: var(--text-muted);">يسعدنا جداً حضوركم ومشاركتنا فرحة خطوبتنا</p>
        
        <div class="names">
            أمير
            <span>&</span>
            فاطمة
        </div>

        <div class="date-badge">📅 الجمعة، ٢٨ نوفمبر ٢٠٢٦</div>

        <div class="countdown-title">العد التنازلي ليلتنا</div>
        <div class="countdown-grid">
            <div class="countdown-box"><div class="countdown-number" id="days">--</div><div class="countdown-label">يوم</div></div>
            <div class="countdown-box"><div class="countdown-number" id="hours">--</div><div class="countdown-label">ساعة</div></div>
            <div class="countdown-box"><div class="countdown-number" id="minutes">--</div><div class="countdown-label">دقيقة</div></div>
            <div class="countdown-box"><div class="countdown-number" id="seconds">--</div><div class="countdown-label">ثانية</div></div>
        </div>

        <button class="btn-action" onclick="addToCalendar()">إضافة إلى التقويم</button>
        
        <div class="footer-note">وجودكم هو ما يكمل فرحتنا ❤️</div>
    </div>

    <script>
        const targetDate = new Date('November 28, 2026 20:00:00').getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;
            if (difference > 0) {
                document.getElementById('days').innerText = Math.floor(difference / (1000 * 60 * 60 * 24));
                document.getElementById('hours').innerText = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById('minutes').innerText = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                document.getElementById('seconds').innerText = Math.floor((difference % (1000 * 60)) / 1000);
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function addToCalendar() {
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('خطوبة أمير وفاطمة')}&dates=20261128T170000Z/20261128T220000Z`, '_blank');
        }
    </script>
</body>
</html>
